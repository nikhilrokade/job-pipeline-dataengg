name: Daily Bronze Job Ingestion

on:
  schedule:
    # 13:30 UTC म्हणजे भारतीय वेळेनुसार (IST) दररोज संध्याकाळी बरोबर 7:00 वाजता
    - cron: '30 13 * * *'
  workflow_dispatch: # GitHub UI वरून स्वतः मॅन्युअली टेस्ट करण्यासाठी

permissions:
  contents: write

jobs:
  ingest-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Bronze Ingestion
        run: |
          python -m src.ingestion.job_client

      - name: Commit and Push Staged Bronze Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronze/*.json
          # नवीन डेटा आला असेल तरच कमिट होईल, अन्यथा स्किप करेल
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(bronze): stage daily job batch $(date -u +'%Y-%m-%d')" && git push)